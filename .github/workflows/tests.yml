name: Restore Drill Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint the shell and the units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        # Pinned, and the same image a maintainer runs locally. Ubuntu's
        # packaged shellcheck is a different version with different defaults,
        # so a tree that lints clean on a laptop can fail here for findings the
        # laptop never mentioned - which is a CI failure that teaches nothing.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 restore-drill.sh tests/e2e-restore-drill.sh
      - name: The systemd units parse
        # systemd-analyze verify reports on units it cannot resolve paths for,
        # so the calendar expressions are checked directly: an OnCalendar that
        # does not parse installs cleanly and then never fires, which is the
        # quietest way for a scheduled job to not exist.
        run: |
          systemd-analyze calendar "$(grep -oP '(?<=^OnCalendar=).*' restore-drill@.timer)"
          systemd-analyze calendar --iterations=3 "$(grep -oP '(?<=^OnCalendar=).*' restore-drill@.timer)"

  drill:
    name: Ten scenarios against real databases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the end-to-end suite
        # Real PostgreSQL and MariaDB containers, real dumps, and the three
        # cases that must FAIL: a truncated archive, a dump that loads cleanly
        # and creates nothing, and a .partial file newer than every backup. A
        # drill that has only ever seen a healthy dump is not known to work.
        run: |
          chmod +x tests/e2e-restore-drill.sh
          ./tests/e2e-restore-drill.sh
